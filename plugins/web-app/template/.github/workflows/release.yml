# Concrete steps for this app. Action versions follow the current Workers GitHub Actions page, not a frozen contract.
# jobs.<job_id>.environment is the key GitHub applies. A step cannot set it.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idenvironment
name: release
on:
  push:
permissions:
  contents: read
# One release at a time per branch, in push order.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: gate
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          status=0
          sh scripts/branch-env.sh >/dev/null || status=$?
          if [ "$status" = 0 ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 3 ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi
      - if: steps.gate.outputs.deploy != 'true'
        run: echo "skip deploy"
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - if: steps.gate.outputs.deploy == 'true'
        run: npm ci
      - if: steps.gate.outputs.deploy == 'true'
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true
      - name: Test, verify, and screenshot
        if: steps.gate.outputs.deploy == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: sh scripts/release.sh check
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: error
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: worker-dist
          path: dist
          if-no-files-found: error
      # wrangler deploy follows this file to the config the Vite build flattened. The deploy runner does not have it otherwise.
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wrangler-redirect
          path: .wrangler/deploy/config.json
          include-hidden-files: true
          if-no-files-found: error
  deploy:
    needs: check
    if: ${{ success() && needs.check.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: worker-dist
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: wrangler-redirect
          path: .wrangler/deploy
      - name: Deploy
        env:
          BRANCH: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: sh scripts/release.sh deploy
      - name: Notify
        env:
          BRANCH: ${{ github.ref_name }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: sh scripts/release.sh notify
