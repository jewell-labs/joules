# Concrete steps for this app. Action versions follow the current Workers GitHub Actions page, not a frozen contract.
name: release
on:
  push:
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - id: gate
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          status=0
          sh scripts/branch-env.sh >/dev/null || status=$?
          if [ "$status" = 0 ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 3 ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi
      - if: steps.gate.outputs.deploy == 'true'
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true
      - name: Test, verify, screenshot, and deploy listed branches
        env:
          BRANCH: ${{ github.ref_name }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: sh scripts/release.sh
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: error
